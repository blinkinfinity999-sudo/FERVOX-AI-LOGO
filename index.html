<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fervox AI</title>
  <style>
    body {
      background-color: #030712;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .logo-container {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(29, 86, 177, 0.4);
      padding: 20px;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      margin-top: 24px;
      font-size: 28px;
      letter-spacing: 1px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    .btn {
      margin-top: 16px;
      padding: 10px 20px;
      background: #1d56b1;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #74c3ee;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="fervox-ai.svg" alt="Fervox AI Logo">
  </div>
  <h1>Fervox AI</h1>
  <p>Official Scalable Vector Graphics (SVG) Logo</p>
  <a class="btn" href="fervox-ai.svg" download>Download SVG</a>
</body>
</html>
